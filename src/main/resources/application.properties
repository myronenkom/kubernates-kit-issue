server.port=${PORT:8080}
logging.level.org.atmosphere = warn

# Launch the default browser when starting the application in development mode
vaadin.launch-browser=true

spring.profiles.active=production
spring.data.redis.host=kubernetes-kit-redis-service

spring.main.allow-bean-definition-overriding=true
vaadin.productionMode=true
vaadin.devmode.sessionSerialization.enabled=false
vaadin.serialization.transients.include-packages=org.vaadin.example
vaadin.serialization.timeout=60000
